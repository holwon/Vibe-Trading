name: Build and Push Docker Image

# Actions are pinned to immutable commit SHAs, matching every other workflow in
# this repository. Newer majors exist for the docker/* actions (v4/v6/v7); those
# are a deliberate, separately testable bump, not a drive-by change here.

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g., v1.0.0, latest)'
        required: true
        default: 'latest'

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Determine image tag
        id: tag
        run: |
          # Determine the image tag based on the trigger event.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "push_latest=${{ inputs.image_tag != 'latest' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              # Git tag push — use the tag name as the image tag
              echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
              echo "push_latest=true" >> "$GITHUB_OUTPUT"
            else
              # Branch push — use 'latest'
              echo "tag=latest" >> "$GITHUB_OUTPUT"
              echo "push_latest=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # PR or other — build-only (no push)
            echo "tag=pr-check" >> "$GITHUB_OUTPUT"
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate image tag
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Fail early with a readable message rather than at the registry push.
          if ! printf '%s' "$IMAGE_TAG" | grep -qE '^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$'; then
            echo "::error::'$IMAGE_TAG' is not a valid Docker tag." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.push_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            if [ "$PUSHED" = "true" ]; then
              echo "### ✅ Docker Image Built and Pushed"
              echo ""
              echo "**Image:** \`${GHCR_IMAGE}:${IMAGE_TAG}\`"
              echo "**Platforms:** linux/amd64, linux/arm64"
              echo ""
              echo '```bash'
              echo "docker pull ${GHCR_IMAGE}:${IMAGE_TAG}"
              echo '```'
              echo ""
              echo "> A newly created GHCR package is **private by default**. Until its"
              echo "> visibility is set to public once in the org package settings, the"
              echo "> pull above works only for authenticated users with read access."
            else
              echo "### 🧪 Build Verification (PR — no push)"
              echo ""
              echo "**Image:** \`${GHCR_IMAGE}:${IMAGE_TAG}\`"
              echo "**Platforms:** linux/amd64, linux/arm64"
              echo ""
              echo "> Docker image was built successfully but NOT pushed (PR trigger)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
